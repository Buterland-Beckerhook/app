name: CI

# Test + audit gate. Runs on every PR and on pushes to the active branch, and is
# the required check that makes Renovate's auto-merge safe (see renovate.json).
# merge_group: the merge queue runs it on main plus the queued PRs before merging.
on:
  pull_request:
  merge_group:
  push:
    branches: [feat/phoenix-rewrite, main]

# Least privilege: this workflow only reads the checkout.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & audit
    runs-on: ubuntu-26.04

    env:
      MIX_ENV: test

    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before the job starts.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app ships no package.json — esbuild is a standalone binary from the :esbuild
      # Hex package. Node is here purely to run the dependency-free `node --test` suites
      # under assets/js (they were previously only runnable by hand).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          # Keep in sync with app/Dockerfile (Renovate updates all three together).
          # renovate: datasource=hexpm-bob depName=elixir
          elixir-version: "1.20.4"
          # renovate: datasource=hexpm-bob depName=erlang versioning=semver-coerced
          otp-version: "29.1.2"

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/deps
            app/_build
          key: mix-${{ runner.os }}-otp29.1.2-ex1.20.4-${{ hashFiles('app/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp29.1.2-ex1.20.4-

      - name: Install dependencies
        run: mix deps.get

      # mix's :httpc can't download from GitHub releases (header size limit, see the
      # script), so precompiled NIFs + tailwind are fetched with curl first.
      - name: Prefetch precompiled artifacts
        run: ./bin/prefetch-precompiled.sh

      - name: Check for unused deps in mix.lock
        run: mix deps.unlock --check-unused

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Audit dependencies for CVEs
        run: mix deps.audit

      - name: Audit for retired packages
        run: mix hex.audit

      - name: Security static analysis (Sobelow)
        run: mix sobelow --config

      # Glob quoted so Node expands it, not the shell: that recurses into future
      # subdirectories. A bare `assets/js` does not work — Node reads a positional
      # argument as a module to load, not a directory to scan. The find guard is the
      # point of the step: Node exits 0 on a glob that matches nothing, so a renamed
      # convention or a moved directory would report success having run no tests.
      - name: Run JavaScript tests
        run: |
          test -n "$(find assets/js -name '*.test.js' -print -quit)" \
            || { echo "No JS test files matched — check the glob in this step."; exit 1; }
          node --test 'assets/js/**/*.test.js'

      # `typst` for the membership application PDF tests (Bbh.Tickets.Pdf) — keep the
      # pin and checksum in sync with app/Dockerfile (a bump needs both; Renovate opens
      # it for review, never auto-merges).
      - name: Install typst
        env:
          # renovate: datasource=github-releases depName=typst/typst
          TYPST_VERSION: "0.15.1"
          TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
        run: |
          curl -fsSL -o /tmp/typst.tar.xz \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      # --cover fails the run below the threshold in mix.exs (test_coverage).
      - name: Run tests
        run: mix test --cover
