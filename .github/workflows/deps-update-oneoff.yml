# TEMPORARY — removed again in the next commit of this branch.
# The session that prepared this PR cannot reach hex.pm, so the lock file is
# regenerated here on a runner and committed back to the branch.
name: One-off deps update
on:
  push:
    branches: [chore/deps-security]
    paths: [.github/workflows/deps-update-oneoff.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"
      - run: mix deps.get
      - run: mix deps.update bandit plug_crypto lazy_html decimal mint
      - run: mix deps.audit
      - run: git diff --stat mix.lock
      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.lock
          git commit -m "chore(deps): bump bandit, plug_crypto, lazy_html, decimal, mint for security advisories"
          git push
