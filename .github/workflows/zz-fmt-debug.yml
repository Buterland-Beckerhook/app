name: fmt-debug (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  fmt:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/deps
            app/_build
          key: mix-${{ runner.os }}-otp29.1.2-ex1.20.4-${{ hashFiles('app/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp29.1.2-ex1.20.4-
      - run: mix deps.get
      - run: |
          mix format || true
          git diff --unified=0 | python3 -c '
          import sys,urllib.parse
          d=sys.stdin.read()
          for i in range(0,len(d),3000):
              print("::warning title=fmt%d::%s" % (i//3000, d[i:i+3000].replace("%","%25").replace("\r","%0D").replace("\n","%0A")))
          '
