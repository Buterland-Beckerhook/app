name: Build & push image

# Builds the Phoenix release image and pushes it to GHCR.
# The server only pulls the image afterwards (docker compose pull) — it never builds.
#
# Multi-arch (linux/amd64 + linux/arm64) is built WITHOUT QEMU emulation: each
# architecture compiles on its own *native* GitHub-hosted runner (amd64 on
# ubuntu-24.04, arm64 on ubuntu-24.04-arm — free for public repos), pushes the
# image by digest, then a final `merge` job stitches the two single-arch images
# into one multi-arch manifest. The legs run in parallel, so wall-clock is
# roughly a single native build instead of the old emulated arm64 leg.
#
# Triggers on push to main, on a release tag (vX.Y.Z) and via "Run workflow"
# (workflow_dispatch) for ad-hoc builds from a feature branch. Tags per build:
#   :beta                    rolling, what the Beta stack runs (not on release tags)
#   :YYYYMMDD-HHMM-<sha>     immutable (UTC build time), what Prod pins — newest
#                            one is what `deploy/update.sh --latest` picks
#   :sha-XXXXXXX             newest build of that commit (moves on a rebuild)
#   :X.Y.Z, :X.Y, :X         release tag vX.Y.Z only (:X from 1.0.0 on)
#
# The `prepare` job fixes the build's identity once — version (`git describe`
# against the vX.Y.Z tags), UTC build time and the immutable tag — and both the
# image (Dockerfile ARGs → BBH_BUILD_*, shown in the admin area by Bbh.BuildInfo)
# and the manifest tags use exactly those values.
#
# A weekly scheduled rebuild of main picks up Debian security updates for the
# runtime packages (openssl, ca-certificates, …): it rebuilds the final stage
# without cache, so its apt-get layer is fetched fresh even when no commit landed.
#
# Automatic patch releases: Prod follows :X (Komodo auto update). A build of main
# whose commits since the last vX.Y.Z are all Renovate's — or none at all, i.e. the
# weekly rebuild of the released commit — is released as vX.Y.(Z+1): the image gets
# :X.Y.Z/:X.Y/:X and the `release` job tags the commit afterwards. As soon as any
# other commit is on main since the last release, nothing is released automatically
# (it would ship that unreleased work to Prod unseen): tag the release by hand after
# checking Beta. A tag created with GITHUB_TOKEN starts no workflow, so it is not
# built twice.
on:
  push:
    branches: [main]
    # Release tags. Path filters are not evaluated for tag pushes.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "app/**"
      - ".github/workflows/build.yml"
  # Manual trigger — also used to build ad-hoc from a feature branch before it
  # merges to main (the push trigger only fires on main).
  workflow_dispatch:
  # Weekly rebuild of main for OS security updates (see above).
  schedule:
    - cron: "17 4 * * 1"

# Deny-all by default; each job re-grants exactly what it needs.
permissions: {}

# Cancel a superseded build on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # github.repository == "Buterland-Beckerhook/app"; it is lowercased to
  # ghcr.io/buterland-beckerhook/app before use (GHCR rejects uppercase names).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version || steps.info.outputs.version }}
      build_time: ${{ steps.info.outputs.build_time }}
      build_tag: ${{ steps.info.outputs.build_tag }}
      image_tag: ${{ steps.info.outputs.image_tag }}
      release: ${{ steps.release.outputs.release }}
      release_minor: ${{ steps.release.outputs.release_minor }}
      release_major: ${{ steps.release.outputs.release_major }}
    steps:
      # Full history + tags (blobs on demand) — `git describe` needs both.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Build identity
        id: info
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          now="$(date -u +%s)"
          build_tag="$(date -u -d "@$now" +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "build_time=$(date -u -d "@$now" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_tag=$build_tag" >> "$GITHUB_OUTPUT"
          # The immutable tag is only pushed for main (see the merge job), so only
          # those images claim it.
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "image_tag=$build_tag" >> "$GITHUB_OUTPUT"
          fi
          # vX.Y.Z → X.Y.Z; three commits later → X.Y.Z-3-g<sha>; no release yet → empty.
          version="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "version: ${version:-(no release tag yet)}, tag: $build_tag"

      # See "Automatic patch releases" at the top.
      - name: Automatic patch release?
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || ! "$EVENT" =~ ^(push|schedule)$ ]]; then
            echo "Not a push/scheduled build of $DEFAULT_BRANCH — no automatic release."
            exit 0
          fi
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [[ -z "$last" ]]; then
            echo "No release tag yet — no automatic release."
            exit 0
          fi
          others="$(git log --no-merges --format='%h %an: %s' "$last..HEAD" | grep -v ' renovate\[bot\]: ' || true)"
          if [[ -n "$others" ]]; then
            echo "::notice::Unreleased non-Renovate commits since $last — no automatic release; tag by hand after checking Beta."
            printf '%s\n' "$others"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="$major.$minor.$((patch + 1))"
          echo "release=$next" >> "$GITHUB_OUTPUT"
          echo "release_minor=$major.$minor" >> "$GITHUB_OUTPUT"
          # A 0.x major is no compatibility promise, so no rolling :0 (as for manual tags).
          [[ "$major" != 0 ]] && echo "release_major=$major" >> "$GITHUB_OUTPUT"
          echo "::notice::Automatic patch release v$next (after $last)"

      # The image shows the version it is released as, not "X.Y.Z-n-g<sha>".
      - name: Version for an automatic release
        if: steps.release.outputs.release != ''
        run: echo "version=${{ steps.release.outputs.release }}" >> "$GITHUB_OUTPUT"
        id: release_version

  build:
    needs: prepare
    # One native runner per architecture — no QEMU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A stuck native-ARM runner queue would otherwise burn the 6h default and
    # block the merge job (needs: build). A native compile is well under this.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare env
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown in the admin area (Bbh.BuildInfo) — see the prepare job.
          build-args: |
            BBH_BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BBH_BUILD_COMMIT=${{ github.sha }}
            BBH_BUILD_REF=${{ github.ref_name }}
            BBH_BUILD_TAG=${{ needs.prepare.outputs.image_tag }}
            BBH_BUILD_TIME=${{ needs.prepare.outputs.build_time }}
            BBH_BUILD_RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # push-by-digest turns a provenance attestation (on by default in v6)
          # into an extra unknown/unknown entry in the merged manifest — disable it.
          provenance: false
          # Per-architecture cache scope so the two legs don't clobber each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # The scheduled rebuild exists to refresh the runtime's apt packages,
          # which a cached final stage would never do.
          no-cache-filters: ${{ github.event_name == 'schedule' && 'final' || '' }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare env
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # No :latest — nothing pulls it, and it would only blur what runs where.
          flavor: latest=false
          tags: |
            # A release tag must not move Beta (it may point at an older commit).
            type=raw,value=beta,enable=${{ github.ref_type != 'tag' }}
            # main only: `update.sh --latest` must never pick a feature-branch build.
            # Same value the image carries as BBH_BUILD_TAG (prepare job).
            type=raw,value=${{ needs.prepare.outputs.build_tag }},enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # A 0.x major is no compatibility promise, so no rolling :0.
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Automatic patch release (prepare job): same three tags for a main build.
            type=raw,value=${{ needs.prepare.outputs.release }},enable=${{ needs.prepare.outputs.release != '' }}
            type=raw,value=${{ needs.prepare.outputs.release_minor }},enable=${{ needs.prepare.outputs.release_minor != '' }}
            type=raw,value=${{ needs.prepare.outputs.release_major }},enable=${{ needs.prepare.outputs.release_major != '' }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  # Automatic patch release: tag the commit once its images are pushed. Created with
  # GITHUB_TOKEN, so the tag push does not start this workflow again.
  release:
    needs: [prepare, merge]
    if: needs.prepare.outputs.release != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag v${{ needs.prepare.outputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.prepare.outputs.release }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          echo "::notice::Tagged $TAG at ${GITHUB_SHA::7}"
