# TEMPORARY — removed again in the next commit of this branch.
# Verifies that the pinned builder and runner images exist on Docker Hub (the session
# that prepared this branch cannot reach Docker Hub).
name: One-off verify images
on:
  push:
    branches: [fix/elixir-image-tag]
    paths: [.github/workflows/resolve-image-oneoff.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          set -euo pipefail
          ex=$(sed -n 's/^ARG ELIXIR_VERSION=//p' app/Dockerfile)
          otp=$(sed -n 's/^ARG OTP_VERSION=//p' app/Dockerfile)
          deb=$(sed -n 's/^ARG DEBIAN_VERSION=//p' app/Dockerfile)
          docker manifest inspect "docker.io/hexpm/elixir:${ex}-erlang-${otp}-debian-${deb}" >/dev/null
          docker manifest inspect "docker.io/debian:${deb}" >/dev/null
          echo OK
