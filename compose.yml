# Development stack: Postgres + Phoenix (mix, source mounted) + Caddy (local HTTPS)
# + Dovecot (the Postfach's collector mailbox, like mailcow's).
# Start with: make dev  (== docker compose up --build)
#
# This is the DEV stack. The production stack lives in deploy/compose.yml and is
# a separate compose project, so their named volumes never collide.
services:
  postgres:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bbh_dev
    ports:
      - "5432:5432"
    volumes:
      # 18+ images keep PGDATA in a major-version subdirectory of this mount.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      MIX_ENV: dev
      PORT: "4000"
    ports:
      # Published for direct access / `make test`; Caddy proxies this internally.
      - "4000:4000"
    volumes:
      - ./app:/app
      # Named volumes shadow host (macOS) artifacts that are ABI-incompatible
      # with this Linux container. priv/uploads(+_cache) arrive via ./app.
      - deps:/app/deps
      - build:/app/_build
    tty: true

  # The Postfach's IMAP mailbox for local tests: the same server software as mailcow,
  # so the import talks the real protocol. `make mail-samples` drops sample mails into
  # INBOX; the poller (every two minutes) files them. Login: any user, USER_PASSWORD.
  dovecot:
    image: dovecot/dovecot:2.4.5@sha256:a2e908c9a93698f3923104ea5be7f4beacde9586242aff5d8059599d0042c62a
    restart: unless-stopped
    environment:
      USER_PASSWORD: postfach
    ports:
      # Plain IMAP for a desktop client (Thunderbird) to look into the mailbox.
      - "1143:31143"
    volumes:
      - ./dev/dovecot/postfach.conf:/etc/dovecot/conf.d/postfach.conf:ro
      - ./dev/dovecot/samples:/samples:ro
      - dovecot_mail:/srv/vmail

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on:
      - phoenix
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  deps:
  build:
  caddy_data:
  caddy_config:
  dovecot_mail:
