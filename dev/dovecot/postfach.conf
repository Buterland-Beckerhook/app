# Dev only: the Postfach's collector mailbox (tickets@) for the local stack.
# Any user logs in with USER_PASSWORD (image default). Plain IMAP inside the compose
# network — production talks IMAPS with a verified certificate to mailcow.
auth_allow_cleartext = yes

# Like mailcow: "/" as hierarchy separator (Tickets/Importiert), and a Junk folder.
namespace inbox {
  separator = /
  mailbox Junk {
    auto = create
    special_use = \Junk
  }
}
