# Journal retention for the bbh stacks (container logs via the journald logging
# driver, see compose.yml). Install once on the host:
#
#   sudo install -D -m 0644 journald-bbh.conf /etc/systemd/journald.conf.d/bbh.conf
#   sudo systemctl restart systemd-journald
#
# Applies to the whole host journal, not only the containers.
[Journal]
# Delete entries older than 30 days — the limit stated in the privacy policy.
MaxRetentionSec=30day
# journald deletes whole journal files, and only once their NEWEST entry is past
# MaxRetentionSec. With the default MaxFileSec=1month a file could hold up to a
# month of entries beyond the limit; rotating daily keeps the overshoot at a day.
MaxFileSec=1day
